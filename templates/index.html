<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISUBÜ Yemek Rezervasyon Asistanı</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a73e8; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #333; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .days-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .day-item { display: flex; align-items: center; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .day-item input { margin-right: 8px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background: #218838; }
        .note { font-size: 12px; color: #666; margin-top: 12px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>ISUBÜ Yemek Rezervasyonu</h2>
    <form action="/book" method="POST">
        <label>Öğrenci E-postası</label>
        <input type="text" name="email" placeholder="ornek@isparta.edu.tr" required>

        <label>Şifre (Parola)</label>
        <input type="password" name="password" placeholder="Kimlik Yönetim Şifreniz" required>

        <label>Öğün Tercihi</label>
        <select name="seans">
            <option value="Ogle">Öğle Yemeği</option>
            <option value="Aksam">Akşam Yemeği</option>
        </select>

        <label>Yemek Alınacak Günler</label>
        <div class="days-group">
            <label class="day-item"><input type="checkbox" name="days" value="Pazartesi" checked> Pazartesi</label>
            <label class="day-item"><input type="checkbox" name="days" value="Salı" checked> Salı</label>
            <label class="day-item"><input type="checkbox" name="days" value="Çarşamba"> Çarşamba</label>
            <label class="day-item"><input type="checkbox" name="days" value="Perşembe"> Perşembe</label>
            <label class="day-item"><input type="checkbox" name="days" value="Cuma" checked> Cuma</label>
        </div>

        <button type="submit">Otomasyonu Başlat</button>
        <div class="note">İşlem tarayıcıda başlatılacak ve 3D Secure SMS ekranında sizden kod beklenecektir.</div>
    </form>
</div>

</body>
</html>
