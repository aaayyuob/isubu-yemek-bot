<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISUBU Yemek Rezervasyon</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1e3a8a; text-align: center; }
    h4 { margin: 15px 0 8px 0; color: #374151; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; color: #4b5563; }
    input[type="text"], input[type="password"], select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .days-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .day-item { display: flex; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; font-size: 13px; }
    .day-item input { margin-right: 8px; }
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ISUBÜ Yemek Rezervasyonu</h2>
    <form action="/book" method="POST">
      <h4>Kullanici Giris Bilgileri</h4>
      <label>E-posta</label>
      <input type="text" name="email" placeholder="ornek@isparta.edu.tr" required>
      <label>Sifre (Parola)</label>
      <input type="password" name="password" required>

      <h4>Kart Bilgileri</h4>
      <label>Kart Uzerindeki Isim</label>
      <input type="text" name="card_name" placeholder="Ad Soyad" required>
      <label>Kart Numarasi</label>
      <input type="text" name="card_number" maxlength="16" placeholder="16 haneli kart numarasi" required>
      <div class="row">
        <div>
          <label>Ay</label>
          <input type="text" name="exp_month" placeholder="01" maxlength="2" required>
        </div>
        <div>
          <label>Yil</label>
          <input type="text" name="exp_year" placeholder="2026" maxlength="4" required>
        </div>
        <div>
          <label>CVV</label>
          <input type="password" name="cvv" placeholder="123" maxlength="3" required>
        </div>
      </div>

      <h4>Yemek Tercihleri</h4>
      <label>Seans Secimi</label>
      <select name="seans">
        <option value="Ogle">Ogle Yemegi</option>
        <option value="Aksam">Aksam Yemegi</option>
      </select>

      <label>Gun Secimi</label>
      <div class="days-grid">
        <label class="day-item"><input type="checkbox" name="days" value="Pazartesi" checked> Pazartesi</label>
        <label class="day-item"><input type="checkbox" name="days" value="Sali" checked> Sali</label>
        <label class="day-item"><input type="checkbox" name="days" value="Carsamba" checked> Carsamba</label>
        <label class="day-item"><input type="checkbox" name="days" value="Persembe" checked> Persembe</label>
        <label class="day-item"><input type="checkbox" name="days" value="Cuma" checked> Cuma</label>
      </div>

      <button type="submit">Sisteme Baglan ve Rezervasyon Yap</button>
    </form>
  </div>
</body>
</html>
