<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İşlem Durumu | ISUBÜ Yemek</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .card { max-width: 650px; margin: 0 auto; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #166534; font-size: 20px; }
    .log-box { background: #111827; color: #10b981; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; margin: 14px 0; max-height: 200px; overflow-y: auto; line-height: 1.6; }
    .screenshot { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 10px; display: block; }
    .btn { display: block; width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; border: none; box-sizing: border-box; }
    .btn-blue { background: #2563eb; color: white; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>İşlem Durumu ve Fiş Raporu</h2>
    
    <div class="log-box">
      {% for log in logs %}
        <div>{{ log }}</div>
      {% endfor %}
    </div>

    <h3 style="margin-top:16px; margin-bottom:6px; font-size:15px; color:#1e3a8a;">Sistemden Alınan Ekran Görüntüsü:</h3>
    {% if screenshot %}
      <img src="data:image/jpeg;base64,{{ screenshot }}" class="screenshot" alt="Ekran Resmi">
    {% else %}
      <p style="color:#ef4444;">Görüntü alınamadı.</p>
    {% endif %}

    <a href="/" class="btn btn-blue">Yeni İşlem Yap (Geri Dön)</a>
  </div>
</body>
</html>
